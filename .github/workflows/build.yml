name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Shared list address (optional repository secret SHARED_SERVICE_JSON)
        shell: pwsh
        env:
          SHARED: ${{ secrets.SHARED_SERVICE_JSON }}
        run: if ($env:SHARED) { $env:SHARED | Out-File assets/shared_service.json -Encoding utf8NoBOM }
      - name: Build
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path assets/shared_service.json) { $extra = @("--add-data", "assets/shared_service.json;assets") }
          python -m PyInstaller --noconfirm --onefile --windowed --icon assets/app.ico --add-data "assets/icons;assets/icons" --add-data "assets/twitch_live.png;assets" @extra --name BetterRecentlyPlayedWith run.py
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\BetterRecentlyPlayedWith.exe -Algorithm SHA256).Hash
          "$h  BetterRecentlyPlayedWith.exe" | Out-File dist\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: BetterRecentlyPlayedWith-windows
          path: dist/*
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BetterRecentlyPlayedWith.exe
            dist/SHA256SUMS.txt
