name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --onefile --windowed --icon assets/app.ico --add-data "assets/icons;assets/icons" --add-data "assets/twitch_live.png;assets" --name BetterRecentlyPlayedWith run.py
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\BetterRecentlyPlayedWith.exe -Algorithm SHA256).Hash
          "$h  BetterRecentlyPlayedWith.exe" | Out-File dist\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: BetterRecentlyPlayedWith-windows
          path: dist/*
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BetterRecentlyPlayedWith.exe
            dist/SHA256SUMS.txt
